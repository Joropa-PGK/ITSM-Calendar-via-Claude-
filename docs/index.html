<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT &amp; ITSM Event-Kalender</title>
<meta name="description" content="IT-, ITSM-, KI-, Cloud- und Digital-Transformation-Veranstaltungen in DACH und Europa / IT, ITSM, AI, cloud and digital transformation events in DACH and Europe – curated by PAAN-Group Consulting.">
<link rel="alternate" hreflang="de" href="?lang=de">
<link rel="alternate" hreflang="en" href="?lang=en">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="vendor/fullcalendar/index.global.min.js"></script>
<script src="vendor/fullcalendar/locale-de.global.min.js"></script>
<style>
:root{
  --navy:#0A3658; --cyan:#1AB7EA; --light:#D1F1FB; --gold:#C6A952; --yellow:#F7D367; --cream:#FDF3D4;
  --bg:#ffffff; --surface:#f6f9fb; --text:#0d1b26; --muted:#5b6b78; --border:#dbe4ea; --link:#0b6fa4;
  --core:#1AB7EA; --related:#0A3658; --peripheral:#8a99a6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1620; --surface:#122230; --text:#e8eff4; --muted:#9fb0bd; --border:#23384a; --link:#5cc8f0;
    --related:#3d7fb3; --peripheral:#6b7c89;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1620; --surface:#122230; --text:#e8eff4; --muted:#9fb0bd; --border:#23384a; --link:#5cc8f0;
  --related:#3d7fb3; --peripheral:#6b7c89;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Maven Pro",system-ui,sans-serif;line-height:1.45}
header{background:var(--navy);color:#fff;padding:20px 16px}
header .wrap{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-weight:800;font-size:clamp(1.3rem,3vw,1.9rem)}
header p{margin:4px 0 0;color:var(--light);font-size:.95rem}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.stamp{font-size:.8rem;color:var(--light)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-weight:700;font-size:.85rem;padding:5px 12px;border:0;background:transparent;color:#fff;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--cyan);color:#05263d}
main{max-width:1200px;margin:0 auto;padding:16px}
.subscribe{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;font-size:.9rem;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#05263d}
.btn:hover{filter:brightness(1.05)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.filters label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);font-weight:600;gap:4px}
.filters select,.filters input{font:inherit;font-size:.92rem;padding:7px 8px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block}
.count{font-size:.9rem;font-weight:700;color:var(--text)}
.tabs{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.fc{--fc-border-color:var(--border);--fc-page-bg-color:var(--bg);--fc-neutral-bg-color:var(--surface);
  --fc-list-event-hover-bg-color:var(--surface);--fc-today-bg-color:rgba(26,183,234,.12);
  --fc-button-bg-color:var(--navy);--fc-button-border-color:var(--navy);--fc-button-active-bg-color:var(--cyan);
  --fc-button-active-border-color:var(--cyan);--fc-button-hover-bg-color:#0d4673;font-size:.9rem}
.fc .fc-toolbar-title{font-size:1.15rem;font-weight:700}
.fc-event{cursor:pointer}
.fc-event.tentative{border-style:dashed !important;opacity:.85}
/* list of filtered events */
.month{margin:18px 0 6px;font-size:1rem;font-weight:800;color:var(--navy)}
:root[data-theme="dark"] .month{color:var(--cyan)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .month{color:var(--cyan)}}
.ev{display:grid;grid-template-columns:118px 1fr;gap:4px 14px;padding:10px 12px;border:1px solid var(--border);border-left:5px solid var(--related);
  border-radius:8px;margin-bottom:8px;background:var(--bg);cursor:pointer}
.ev:hover{background:var(--surface)}
.ev.core{border-left-color:var(--core)} .ev.peripheral{border-left-color:var(--peripheral)}
.ev.tentative{border-left-style:dashed}
.ev .d{font-weight:700;font-size:.88rem;color:var(--muted)}
.ev .t{font-weight:700}
.ev .m{grid-column:2;font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;background:var(--light);color:var(--navy);border-radius:999px;padding:1px 8px;font-size:.75rem;margin:2px 4px 0 0;font-weight:600}
.tag.tbc{background:var(--cream);color:#7a5d00}
.tag.fmt{background:transparent;border:1px solid var(--border);color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}
dialog{border:none;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--bg);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,20,32,.55)}
.dlg-head{background:var(--navy);color:#fff;padding:14px 16px}
.dlg-head h2{margin:0;font-size:1.15rem}
.dlg-body{padding:14px 16px;font-size:.93rem}
.dlg-body dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0 0 10px}
.dlg-body dt{color:var(--muted);font-weight:600}
.dlg-body dd{margin:0;overflow-wrap:anywhere}
.dlg-body a, td a, footer a{color:var(--link)}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 16px 14px;flex-wrap:wrap}
section.watch{margin-top:28px}
section.watch h2{font-size:1.1rem;margin:0 0 4px}
section.watch p{color:var(--muted);font-size:.88rem;margin:0 0 10px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface);font-weight:700}
footer{max-width:1200px;margin:24px auto;padding:0 16px 24px;font-size:.8rem;color:var(--muted)}
[hidden]{display:none !important}
@media (max-width:640px){
  .fc .fc-toolbar{flex-direction:column;gap:8px}
  .dlg-body dl{grid-template-columns:1fr}
  .ev{grid-template-columns:1fr}
  .ev .m{grid-column:1}
  .hright{align-items:flex-start}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="hright">
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>
</header>

<main>
  <div class="subscribe">
    <a class="btn primary" id="gcal" target="_blank" rel="noopener" data-i18n="subGoogle"></a>
    <a class="btn" id="webcal" data-i18n="subOther"></a>
    <a class="btn" href="events.ics" download data-i18n="dlAll"></a>
    <a class="btn" href="events-itsm.ics" download data-i18n="dlItsm"></a>
    <a class="btn" href="events-dach.ics" download data-i18n="dlDach"></a>
    <a class="btn" href="events.xlsx" download data-i18n="dlXlsx"></a>
  </div>

  <div class="filters">
    <label><span data-i18n="fSearch"></span><input id="q" type="search" autocomplete="off"></label>
    <label><span data-i18n="fTime"></span><select id="time"></select></label>
    <label><span data-i18n="fRel"></span><select id="rel"></select></label>
    <label><span data-i18n="fReg"></span><select id="reg"></select></label>
    <label><span data-i18n="fCat"></span><select id="cat"></select></label>
    <label><span data-i18n="fFmt"></span><select id="fmt"></select></label>
    <label><span data-i18n="fStatus"></span><select id="st"></select></label>
  </div>
  <div class="bar">
    <div class="count" id="count" aria-live="polite"></div>
    <button class="btn" id="reset" type="button" data-i18n="reset"></button>
  </div>
  <div class="legend" style="margin-bottom:12px">
    <span><i class="dot" style="background:var(--core)"></i><span data-i18n="lgCore"></span></span>
    <span><i class="dot" style="background:var(--related)"></i><span data-i18n="lgRel"></span></span>
    <span><i class="dot" style="background:var(--peripheral)"></i><span data-i18n="lgPer"></span></span>
    <span><i class="dot" style="border:2px dashed var(--muted)"></i><span data-i18n="lgTbc"></span></span>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-list" aria-selected="true" data-i18n="tabList"></button>
    <button type="button" role="tab" id="tab-cal" aria-selected="false" data-i18n="tabCal"></button>
  </div>
  <div id="listview"></div>
  <div id="calview" hidden><div id="calendar"></div></div>

  <section class="watch">
    <h2 data-i18n="watchTitle"></h2>
    <p data-i18n="watchText"></p>
    <div class="tablewrap"><table><thead><tr><th data-i18n="thEvent"></th><th data-i18n="thExpected"></th><th data-i18n="thLoc"></th></tr></thead><tbody id="watch"></tbody></table></div>
  </section>
</main>

<dialog id="dlg">
  <div class="dlg-head"><h2 id="d-title"></h2></div>
  <div class="dlg-body">
    <dl>
      <dt data-i18n="dDate"></dt><dd id="d-date"></dd>
      <dt data-i18n="dLoc"></dt><dd id="d-loc"></dd>
      <dt data-i18n="dWeb"></dt><dd><a id="d-url" target="_blank" rel="noopener"></a></dd>
    </dl>
    <div id="d-tags"></div>
    <p id="d-desc"></p>
    <p id="d-note" style="color:#a0522d"></p>
  </div>
  <div class="dlg-foot">
    <a class="btn" id="d-add" target="_blank" rel="noopener" data-i18n="dAdd"></a>
    <button class="btn primary" id="d-close" type="button" data-i18n="dClose"></button>
  </div>
</dialog>

<footer data-i18n-html="footer"></footer>

<script>
(function(){
  "use strict";
  const T = {
    de: {
      title:"IT & ITSM Event-Kalender", subtitle:"ITSM/ESM · KI · Cloud · Security · Digitale Transformation – Fokus DACH",
      stamp:"Stand", subGoogle:"In Google Kalender abonnieren", subOther:"Abonnieren (Outlook/Apple)",
      dlAll:"Alle (.ics)", dlItsm:"Nur ITSM (.ics)", dlDach:"Nur DACH (.ics)", dlXlsx:"Excel-Liste (.xlsx)",
      fSearch:"Suche", searchPh:"Titel, Ort, Veranstalter …", fTime:"Zeitraum", fRel:"Relevanz", fReg:"Region", fCat:"Thema", fFmt:"Format", fStatus:"Status",
      tUpcoming:"Ab heute", t2026:"Nur 2026", t2027:"Nur 2027", tAll:"Alle (inkl. vergangene)",
      rDefault:"ITSM + verwandte Themen", rCore:"Nur ITSM/ESM", rAll:"Alle (inkl. Randthemen)",
      all:"Alle", regDACH:"DACH", regDE:"Nur Deutschland", regEurope:"Europa (ohne DACH)", regInternational:"International", regOnline:"Online",
      stConfirmed:"Bestätigt", stTentative:"Vorläufig (TBC)",
      count:(n,t)=>`${n} von ${t} Veranstaltungen`, reset:"Filter zurücksetzen",
      lgCore:"ITSM/ESM (Kern)", lgRel:"KI, Cloud, Security, Digital", lgPer:"Randthema", lgTbc:"Termin vorläufig",
      tabList:"Liste", tabCal:"Kalender", empty:"Keine Veranstaltungen für diese Filter.",
      watchTitle:"Beobachtungsliste – noch ohne bestätigten Termin",
      watchText:"Diese Veranstaltungen werden erwartet, haben aber noch kein belastbares Datum. Der Crawler prüft sie bei jedem Lauf.",
      thEvent:"Veranstaltung", thExpected:"Erwartet", thLoc:"Ort",
      dDate:"Datum", dLoc:"Ort", dWeb:"Website", dAdd:"Einzeln in Google Kalender", dClose:"Schließen", tbc:"Termin vorläufig", note:"Hinweis",
      today:"Heute", month:"Monat", list:"Liste", noEvents:"Keine Veranstaltungen im Zeitraum",
      cat:{"ITSM":"ITSM/ESM","AI":"KI","Cloud":"Cloud","Security":"Security","Digital Transformation":"Digitale Transformation","Developer":"Developer"},
      fmt:{conference:"Konferenz/Kongress",tradefair:"Messe",forum:"Forum/Treffen",workshop:"Workshop",meetup:"Meetup/User Group",webinar:"Webinar/Online",training:"Training"},
      footer:'Kuratiert von <a href="https://paan-group.com" target="_blank" rel="noopener">PAAN-Group Consulting</a>. Angaben ohne Gewähr – Termine bitte vor Reiseplanung auf der Veranstalterseite prüfen. Automatische Aktualisierung per Crawler mit manueller Freigabe.',
      locale:"de-DE"
    },
    en: {
      title:"IT & ITSM Event Calendar", subtitle:"ITSM/ESM · AI · Cloud · Security · Digital Transformation – focus on DACH",
      stamp:"Updated", subGoogle:"Subscribe in Google Calendar", subOther:"Subscribe (Outlook/Apple)",
      dlAll:"All (.ics)", dlItsm:"ITSM only (.ics)", dlDach:"DACH only (.ics)", dlXlsx:"Excel list (.xlsx)",
      fSearch:"Search", searchPh:"Title, location, organiser …", fTime:"Period", fRel:"Relevance", fReg:"Region", fCat:"Topic", fFmt:"Format", fStatus:"Status",
      tUpcoming:"From today", t2026:"2026 only", t2027:"2027 only", tAll:"All (incl. past)",
      rDefault:"ITSM + related topics", rCore:"ITSM/ESM only", rAll:"All (incl. peripheral)",
      all:"All", regDACH:"DACH", regDE:"Germany only", regEurope:"Europe (excl. DACH)", regInternational:"International", regOnline:"Online",
      stConfirmed:"Confirmed", stTentative:"Tentative (TBC)",
      count:(n,t)=>`${n} of ${t} events`, reset:"Reset filters",
      lgCore:"ITSM/ESM (core)", lgRel:"AI, cloud, security, digital", lgPer:"Peripheral topic", lgTbc:"Date tentative",
      tabList:"List", tabCal:"Calendar", empty:"No events match these filters.",
      watchTitle:"Watchlist – no confirmed date yet",
      watchText:"These events are expected but do not have a reliable date yet. The crawler checks them on every run.",
      thEvent:"Event", thExpected:"Expected", thLoc:"Location",
      dDate:"Date", dLoc:"Location", dWeb:"Website", dAdd:"Add to Google Calendar", dClose:"Close", tbc:"Date tentative", note:"Note",
      today:"Today", month:"Month", list:"List", noEvents:"No events in this period",
      cat:{"ITSM":"ITSM/ESM","AI":"AI","Cloud":"Cloud","Security":"Security","Digital Transformation":"Digital transformation","Developer":"Developer"},
      fmt:{conference:"Conference/congress",tradefair:"Trade fair",forum:"Forum/meeting",workshop:"Workshop",meetup:"Meetup/user group",webinar:"Webinar/online",training:"Training"},
      footer:'Curated by <a href="https://paan-group.com" target="_blank" rel="noopener">PAAN-Group Consulting</a>. No liability for accuracy – please verify dates on the organiser\'s website before making travel plans. Updated automatically by a crawler with manual review.',
      locale:"en-GB"
    }
  };
  const $ = id => document.getElementById(id);
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(_){} } };
  const params = new URLSearchParams(location.search);
  let lang = params.get("lang") || store.get("lang") || ((navigator.language||"de").toLowerCase().startsWith("de") ? "de" : "en");
  if (!T[lang]) lang = "de";
  const t = k => T[lang][k];
  const iso = d => d.toISOString().slice(0,10);
  const TODAY = iso(new Date());
  const addDay = d => { const x = new Date(d+"T00:00:00Z"); x.setUTCDate(x.getUTCDate()+1); return iso(x); };
  const fmtDate = d => new Date(d+"T00:00:00").toLocaleDateString(t("locale"), {day:"2-digit",month:"2-digit",year:"numeric"});
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  let all = [], watch = [], generated = null, cal = null, view = store.get("view") || "list";

  const FILTERS = ["q","time","rel","reg","cat","fmt","st"];
  const DEFAULTS = {q:"", time:"upcoming", rel:"core,related", reg:"", cat:"", fmt:"", st:""};

  function fillSelect(id, opts){
    const sel = $(id), cur = sel.value || store.get("f_"+id) || DEFAULTS[id];
    sel.innerHTML = "";
    opts.forEach(([v,label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); });
    sel.value = opts.some(o => o[0]===cur) ? cur : DEFAULTS[id];
  }
  function buildSelects(){
    fillSelect("time", [["upcoming",t("tUpcoming")],["2026",t("t2026")],["2027",t("t2027")],["all",t("tAll")]]);
    fillSelect("rel", [["core,related",t("rDefault")],["core",t("rCore")],["core,related,peripheral",t("rAll")]]);
    fillSelect("reg", [["",t("all")],["DACH",t("regDACH")],["DE",t("regDE")],["Europe",t("regEurope")],["International",t("regInternational")],["Online",t("regOnline")]]);
    fillSelect("cat", [["",t("all")], ...Object.keys(T.de.cat).map(k => [k, t("cat")[k]])]);
    fillSelect("fmt", [["",t("all")], ...Object.keys(T.de.fmt).map(k => [k, t("fmt")[k]])]);
    fillSelect("st", [["",t("all")],["confirmed",t("stConfirmed")],["tentative",t("stTentative")]]);
    $("q").placeholder = t("searchPh");
  }
  function applyLang(){
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
    buildSelects();
    if (generated) $("stamp").textContent = t("stamp") + ": " + new Date(generated).toLocaleString(t("locale"), {dateStyle:"medium", timeStyle:"short"});
    if (cal) { cal.setOption("locale", lang); cal.setOption("buttonText", {today:t("today"), month:t("month"), list:t("list")}); cal.setOption("noEventsContent", t("noEvents")); }
    renderWatch();
    refresh();
  }

  function filtered(){
    const q = $("q").value.toLowerCase().trim(), time = $("time").value, rel = $("rel").value.split(",");
    const reg = $("reg").value, cat = $("cat").value, fmt = $("fmt").value, st = $("st").value;
    return all.filter(e =>
      (time==="all" || (time==="upcoming" ? e.end >= TODAY : e.start.slice(0,4)===time)) &&
      rel.includes(e.relevance) &&
      (!reg || (reg==="DE" ? e.country==="DE" : e.region===reg)) &&
      (!cat || e.categories.includes(cat)) && (!fmt || e.format===fmt) && (!st || e.status===st) &&
      (!q || [e.title, e.location, e.description_de, e.description_en, e.url].join(" ").toLowerCase().includes(q))
    ).sort((a,b) => a.start.localeCompare(b.start) || a.title.localeCompare(b.title));
  }
  const desc = e => (lang==="de" ? (e.description_de || e.description_en) : (e.description_en || e.description_de)) || "";

  function tag(text, cls){ const s = document.createElement("span"); s.className = "tag" + (cls ? " "+cls : ""); s.textContent = text; return s; }

  function renderList(list){
    const box = $("listview"); box.innerHTML = "";
    if (!list.length){ const d = document.createElement("div"); d.className = "empty"; d.textContent = t("empty"); box.appendChild(d); return; }
    let cur = "";
    list.forEach(e => {
      const m = e.start.slice(0,7);
      if (m !== cur){
        cur = m;
        const h = document.createElement("div"); h.className = "month";
        h.textContent = new Date(e.start+"T00:00:00").toLocaleDateString(t("locale"), {month:"long", year:"numeric"});
        box.appendChild(h);
      }
      const row = document.createElement("div");
      row.className = "ev " + e.relevance + (e.status==="tentative" ? " tentative" : "");
      row.tabIndex = 0; row.setAttribute("role","button");
      const d = document.createElement("div"); d.className = "d"; d.textContent = e.start===e.end ? fmtDate(e.start) : fmtDate(e.start)+" –\n"+fmtDate(e.end); d.style.whiteSpace = "pre-line";
      const ti = document.createElement("div"); ti.className = "t"; ti.textContent = e.title;
      const meta = document.createElement("div"); meta.className = "m";
      meta.append(document.createTextNode((e.location || "–") + "  "));
      meta.appendChild(tag(t("fmt")[e.format] || e.format, "fmt"));
      e.categories.forEach(c => meta.appendChild(tag(t("cat")[c] || c)));
      if (e.status==="tentative") meta.appendChild(tag(t("tbc"), "tbc"));
      row.append(d, ti, meta);
      row.addEventListener("click", () => openDlg(e));
      row.addEventListener("keydown", ev => { if (ev.key==="Enter" || ev.key===" ") { ev.preventDefault(); openDlg(e); } });
      box.appendChild(row);
    });
  }
  function toFc(e){
    const color = css("--"+e.relevance);
    return {id:e.id, title:e.title + (e.status==="tentative" ? " (TBC)" : ""), start:e.start, end:addDay(e.end), allDay:true,
      backgroundColor:color, borderColor:e.status==="tentative" ? css("--gold") : color, textColor:e.relevance==="core" ? "#05263d" : "#fff",
      classNames:e.status==="tentative" ? ["tentative"] : [], extendedProps:e};
  }
  function refresh(){
    const list = filtered();
    $("count").textContent = t("count")(list.length, all.length);
    renderList(list);
    if (cal){ cal.getEventSources().forEach(s => s.remove()); cal.addEventSource(list.map(toFc)); }
  }
  function openDlg(e){
    $("d-title").textContent = e.title;
    $("d-date").textContent = e.start===e.end ? fmtDate(e.start) : fmtDate(e.start)+" – "+fmtDate(e.end);
    $("d-loc").textContent = e.location || "–";
    $("d-url").href = e.url; $("d-url").textContent = e.url;
    const tags = $("d-tags"); tags.innerHTML = "";
    tags.appendChild(tag(t("fmt")[e.format] || e.format, "fmt"));
    e.categories.forEach(c => tags.appendChild(tag(t("cat")[c] || c)));
    tags.appendChild(tag(e.region));
    if (e.status==="tentative") tags.appendChild(tag(t("tbc"), "tbc"));
    $("d-desc").textContent = desc(e);
    $("d-note").textContent = e.note ? t("note")+": "+e.note : "";
    const g = new URL("https://calendar.google.com/calendar/render");
    g.searchParams.set("action","TEMPLATE"); g.searchParams.set("text", e.title);
    g.searchParams.set("dates", e.start.replaceAll("-","")+"/"+addDay(e.end).replaceAll("-",""));
    g.searchParams.set("location", e.location || ""); g.searchParams.set("details", e.url+"\n\n"+desc(e));
    $("d-add").href = g.toString();
    $("dlg").showModal();
  }
  function renderWatch(){
    const tb = $("watch"); tb.innerHTML = "";
    watch.forEach(x => {
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); const a = document.createElement("a"); a.href = x.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = x.title; td1.appendChild(a);
      const td2 = document.createElement("td"); td2.textContent = (lang==="en" && x.expected_en) ? x.expected_en : x.expected;
      const td3 = document.createElement("td"); td3.textContent = x.location;
      tr.append(td1, td2, td3); tb.appendChild(tr);
    });
  }
  function setView(v){
    view = v; store.set("view", v);
    $("tab-list").setAttribute("aria-selected", String(v==="list"));
    $("tab-cal").setAttribute("aria-selected", String(v==="cal"));
    $("listview").hidden = v!=="list"; $("calview").hidden = v!=="cal";
    if (v==="cal"){ ensureCal(); cal.updateSize(); }
  }
  function ensureCal(){
    if (cal || typeof FullCalendar === "undefined") return;
    cal = new FullCalendar.Calendar($("calendar"), {
      locale:lang, firstDay:1, height:"auto", initialView:"dayGridMonth",
      headerToolbar:{left:"prev,next today", center:"title", right:""},
      buttonText:{today:t("today"), month:t("month"), list:t("list")}, noEventsContent:t("noEvents"),
      dayMaxEvents:4,
      eventClick: info => { info.jsEvent.preventDefault(); openDlg(info.event.extendedProps); },
      eventDidMount: info => { const e = info.event.extendedProps; info.el.title = e.title + (e.location ? " – " + e.location : ""); }
    });
    cal.render();
    cal.addEventSource(filtered().map(toFc));
  }

  // events: 'input' for text, 'change' + 'input' for selects (Safari fires only 'change')
  FILTERS.forEach(id => ["input","change"].forEach(evt => $(id).addEventListener(evt, () => {
    if (id !== "q") store.set("f_"+id, $(id).value);
    refresh();
  })));
  $("reset").addEventListener("click", () => {
    FILTERS.forEach(id => { $(id).value = DEFAULTS[id]; if (id !== "q") store.set("f_"+id, DEFAULTS[id]); });
    refresh();
  });
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
    lang = b.dataset.lang; store.set("lang", lang);
    const u = new URL(location.href); u.searchParams.set("lang", lang); history.replaceState(null, "", u);
    applyLang();
  }));
  $("tab-list").addEventListener("click", () => setView("list"));
  $("tab-cal").addEventListener("click", () => setView("cal"));
  $("d-close").addEventListener("click", () => $("dlg").close());

  const feed = new URL("events.ics", location.href);
  $("gcal").href = "https://calendar.google.com/calendar/r?cid=" + encodeURIComponent("webcal://" + feed.host + feed.pathname);
  $("webcal").href = "webcal://" + feed.host + feed.pathname;

  applyLang();
  setView(view);
  Promise.all([
    fetch("events.json").then(r => r.json()),
    fetch("watchlist.json").then(r => r.json()).catch(() => [])
  ]).then(([d, w]) => {
    all = d.events; watch = w; generated = d.generated;
    applyLang();
  });
})();
</script>
</body>
</html>
