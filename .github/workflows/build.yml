name: Build calendar feeds

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Security tests
        run: pip install pytest==8.3.5 && python -m pytest -q tests
      - working-directory: scripts
        run: python build.py
      - name: Commit generated files
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/ EVENTS.md
          git diff --cached --quiet || (git commit -m "Build: Kalender-Feeds aktualisiert" && git push)
