name: Build calendar feeds

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - working-directory: scripts
        run: python build.py
      - name: Commit generated files
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add docs/ EVENTS.md
          git diff --cached --quiet || (git commit -m "Build: Kalender-Feeds aktualisiert" && git push)
